[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-pipeline"
version = "0.1.0"
description = "A small, opinionated skeleton for recurring business reports: pluggable collectors, one computed payload, fan-out to every surface, with self-healing backfill so a bad night doesn't quietly poison the numbers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cemre Akkaya" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/cemre-akkaya/report-pipeline"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
report-pipeline = "report_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["report_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
